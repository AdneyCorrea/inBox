<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar · inBox</title>
    <link rel="stylesheet" href="/simple.css" />
    <link rel="stylesheet" href="/theme.css" />
    <script defer src="/js/http.js"></script>
    <script defer src="/login.js"></script>
  </head>
  <body class="login-body">
    <main class="login-page">
      <section class="card login-card">
        <a class="brand" href="/">
          <strong>
            inBox
            <span>.</span>
          </strong>
        </a>
        <h1>Entre para continuar</h1>
        <p class="helper">Acesse os cadastros e encontre a caixa para seu pedido.</p>
        <p id="login-message" class="notice error" role="alert" hidden></p>
        <form action="/login" method="post">
          <input id="csrf" type="hidden" />
          <label>
            Usuário
            <input
              name="username"
              autocomplete="username"
              required
              maxlength="100"
              autofocus
              placeholder="Seu usuário"
            />
          </label>
          <label>
            Senha
            <input
              name="password"
              type="password"
              autocomplete="current-password"
              required
              placeholder="Sua senha"
            />
          </label>
          <button id="login-submit" class="button primary" disabled>Entrar</button>
        </form>
        <p class="helper login-access-note">
          Acesso restrito à equipe. Para recuperar sua senha, procure o responsável pelo aplicativo.
        </p>
      </section>
    </main>
  </body>
</html>
