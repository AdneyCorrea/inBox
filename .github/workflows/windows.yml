# Testa e gera a versão Windows; publica o pacote pronto a cada atualização da main.
name: Windows em um clique
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar interface
        shell: pwsh
        run: node --test backend/src/test/js/workflow.test.cjs
      - name: Compilar, testar Java e empacotar
        shell: powershell
        run: ./backend/scripts/empacotar.ps1
      - name: Testar inicialização com Java incluído
        shell: pwsh
        run: |
          $exe = [IO.File]::ReadAllText("$env:GITHUB_WORKSPACE/backend/target/desktop-path.txt")
          $app = Split-Path -Parent $exe
          & "$app/runtime/bin/java.exe" "-Dinbox.desktop.data=$env:RUNNER_TEMP/inbox-smoke" -cp "$app/app/launcher.jar" DesktopLauncher --smoke-test
          if ($LASTEXITCODE) { throw 'O aplicativo empacotado não iniciou.' }
      - name: Calcular checksum
        shell: pwsh
        run: |
          $zip = 'backend/target/inBox-Windows.zip'
          "$((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower())  inBox-Windows.zip" | Set-Content -Encoding ascii backend/target/inBox-Windows.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: inBox-Windows
          path: |
            backend/target/inBox-Windows.zip
            backend/target/inBox-Windows.zip.sha256
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: inBox-Windows
          path: release
      - name: Publicar distribuição pronta
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Windows x64: baixe inBox-Windows.zip, extraia tudo e abra inBox.exe. Java incluído.\n\nCompilado do commit %s.\n' "$COMMIT" > notes.txt
          if [[ "$REF" == refs/tags/v* ]]; then
            tag="$TAG_NAME"
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --title "inBox $tag" --notes-file notes.txt
          else
            tag=windows-preview
            if gh release view "$tag" >/dev/null 2>&1; then
              gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$tag" -f sha="$COMMIT" -F force=true
              gh release edit "$tag" --title "Windows — versão de teste" --notes-file notes.txt --prerelease
            else
              gh release create "$tag" --target "$COMMIT" --title "Windows — versão de teste" --notes-file notes.txt --prerelease
            fi
          fi
          gh release upload "$tag" release/inBox-Windows.zip release/inBox-Windows.zip.sha256 --clobber