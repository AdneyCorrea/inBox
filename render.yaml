services:
  - type: web
    name: inbox
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/ready
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: cloud
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_LOGIN_USERNAME
        sync: false
      - key: APP_LOGIN_PASSWORD_HASH
        sync: false
